<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The stylesheet arrives with the app; paint the right background before it does. -->
    <style>html { background: oklch(1 0 0); } html.dark { background: oklch(0.145 0 0); }</style>
    <script>
      // Before first paint, so dark mode doesn't flash white while the app loads.
      (function() {
        var theme = "system";
        try { theme = localStorage.getItem("vibe:theme") || "system"; } catch (e) {}
        if(theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <meta name="robots" content="noindex" />
    <title>Editor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/entry.ts"></script>
  </body>
</html>
