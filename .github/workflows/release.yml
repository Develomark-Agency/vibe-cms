name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

      - name: Check the tag matches the package version
        run: |
          pkg=$(bun -e 'console.log(require("./packages/vibe-cms/package.json").version)')
          [ "v$pkg" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match package version $pkg"; exit 1; }

      - name: Pack (builds the panel and compiles dist with tsdown)
        working-directory: packages/vibe-cms
        run: bun run package --destination "$GITHUB_WORKSPACE"

      - name: Check the tarball ships the panel and the compiled package
        run: |
          files=$(tar -tzf vibe-cms-*.tgz)
          for f in panel-dist/index.js dist/index.js dist/index.d.ts dist/cli/index.js; do
            grep -qx "package/$f" <<< "$files" || { echo "Tarball is missing $f"; exit 1; }
          done

      - name: Smoke-test the tarball under Node
        run: |
          mkdir smoke && cd smoke
          echo '{"name":"smoke","private":true,"type":"module"}' > package.json
          bun add "$(ls "$GITHUB_WORKSPACE"/vibe-cms-*.tgz)"
          node --input-type=module -e 'await import("vibe-cms"); await import("vibe-cms/schema"); await import("vibe-cms/vite"); process.exit(0)'

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" vibe-cms-*.tgz --draft --generate-notes --title "$GITHUB_REF_NAME" $flags
